<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Ladle — a hearthside cooking rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241608; }
  /* The canvas keeps its 16:9 shape and letterboxes inside the window. */
  #game {
    position: fixed; inset: 0; margin: auto;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block; touch-action: none;
    background: #2c1c10;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Gilded Ladle: take orders, chop and grill ingredients, build dishes and serve them before patience runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
